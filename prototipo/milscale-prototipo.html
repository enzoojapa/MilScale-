<title>MilScale</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --oliva:#3f4a2e; --oliva-fundo:#232a19; --oliva-claro:#6d7a52; --oliva-vivo:#8a9a63;
  --ground:#f2f0e7; --superficie:#fffdf8; --superficie-2:#f8f6ee;
  --tinta:#232719; --tinta-suave:#6b6f5e; --linha:#dedac9; --linha-forte:#c9c4ae;
  --alerta:#a3342b; --alerta-fundo:#f6e2df;
  --atencao:#8a6212; --atencao-fundo:#f8ead0;
  --info:#2c5670; --info-fundo:#dde8ef;
  --bom:#4a6329; --bom-fundo:#e3ecd4;
  --trilho:#232a19; --trilho-tinta:#dfe3d2; --trilho-linha:rgba(255,255,255,.13);
  --sombra:0 1px 2px rgba(35,39,25,.07), 0 1px 8px rgba(35,39,25,.04);
  --display:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --corpo:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --dado:'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --oliva:#9db072; --oliva-fundo:#161911; --oliva-claro:#8a9a63; --oliva-vivo:#b3c489;
    --ground:#15180f; --superficie:#1e2217; --superficie-2:#242a1c;
    --tinta:#e7e9dc; --tinta-suave:#9ba192; --linha:#333a27; --linha-forte:#454d35;
    --alerta:#e79087; --alerta-fundo:#3a221f;
    --atencao:#dcb055; --atencao-fundo:#382c14;
    --info:#8fbdd6; --info-fundo:#1b2c36;
    --bom:#a8c47c; --bom-fundo:#242e18;
    --trilho:#11140c; --trilho-tinta:#d3d9c4; --trilho-linha:rgba(255,255,255,.09);
    --sombra:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --oliva:#9db072; --oliva-fundo:#161911; --oliva-claro:#8a9a63; --oliva-vivo:#b3c489;
  --ground:#15180f; --superficie:#1e2217; --superficie-2:#242a1c;
  --tinta:#e7e9dc; --tinta-suave:#9ba192; --linha:#333a27; --linha-forte:#454d35;
  --alerta:#e79087; --alerta-fundo:#3a221f;
  --atencao:#dcb055; --atencao-fundo:#382c14;
  --info:#8fbdd6; --info-fundo:#1b2c36;
  --bom:#a8c47c; --bom-fundo:#242e18;
  --trilho:#11140c; --trilho-tinta:#d3d9c4; --trilho-linha:rgba(255,255,255,.09);
  --sombra:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--tinta);font-family:var(--corpo);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--oliva-vivo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- estrutura ---------- */
#app{display:flex;min-height:100vh}
.trilho{width:230px;flex:0 0 230px;background:var(--trilho);color:var(--trilho-tinta);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brasao{padding:16px 18px 13px;border-bottom:1px solid var(--trilho-linha)}
.brasao .nome{font-family:var(--display);font-size:25px;font-weight:700;letter-spacing:.06em;line-height:1;color:#fff}
.brasao .om{font-family:var(--dado);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.6;margin-top:6px}
.navegacao{flex:1;overflow-y:auto;padding:4px 0 16px}
.navegacao .secao{font-family:var(--dado);font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.45;padding:15px 18px 6px}
.navegacao button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--trilho-tinta);font-family:var(--corpo);font-size:14px;padding:7px 18px;cursor:pointer}
.navegacao button:hover{background:rgba(255,255,255,.06)}
.navegacao button.ativo{background:rgba(255,255,255,.11);border-left-color:var(--oliva-vivo);color:#fff;font-weight:600}
.navegacao button .exclusiva{font-family:var(--dado);font-size:8.5px;letter-spacing:.08em;color:var(--oliva-vivo);border:1px solid currentColor;border-radius:2px;padding:0 3px}
.navegacao button .contador{font-family:var(--dado);font-size:10.5px;background:var(--alerta);color:#fff;border-radius:8px;padding:1px 6px}
.rodape-trilho{padding:11px 18px;border-top:1px solid var(--trilho-linha);font-size:13px}
.rodape-trilho .quem{font-weight:600;color:#fff}
.rodape-trilho .papel{font-family:var(--dado);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.6;margin-top:1px}
.rodape-trilho button{margin-top:9px;width:100%;background:none;border:1px solid var(--trilho-linha);color:var(--trilho-tinta);border-radius:3px;padding:5px;font-family:var(--corpo);font-size:12.5px;cursor:pointer}
.rodape-trilho button:hover{background:rgba(255,255,255,.08)}

.painel{flex:1;min-width:0;display:flex;flex-direction:column}
.topo{background:var(--superficie);border-bottom:1px solid var(--linha);padding:15px 28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.topo h1{font-size:25px;line-height:1.1}
.topo .uc{font-family:var(--dado);font-size:10.5px;letter-spacing:.08em;color:var(--tinta-suave);text-transform:uppercase;margin-top:4px}
.tela{padding:22px 28px 70px;max-width:1500px}

/* ---------- blocos ---------- */
.bloco{background:var(--superficie);border:1px solid var(--linha);border-radius:5px;margin-bottom:18px;box-shadow:var(--sombra)}
.bloco > h2{font-size:15px;letter-spacing:.03em;padding:11px 16px;border-bottom:1px solid var(--linha);background:var(--superficie-2);border-radius:5px 5px 0 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bloco > .miolo{padding:16px}
.bloco > .miolo > p:first-child{margin-top:0}
.bloco > .miolo > :last-child{margin-bottom:0}

.faixa{display:grid;gap:14px;margin-bottom:18px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.par{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.metrica{background:var(--superficie);border:1px solid var(--linha);border-radius:5px;padding:13px 15px}
.metrica .n{font-family:var(--display);font-size:31px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.metrica .n.pequeno{font-size:19px}
.metrica .r{font-size:12.5px;color:var(--tinta-suave);margin-top:5px;line-height:1.35}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--dado);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tinta-suave);text-align:left;padding:7px 10px;border-bottom:1px solid var(--linha-forte);white-space:nowrap;font-weight:500}
td{padding:7px 10px;border-bottom:1px solid var(--linha);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--superficie-2)}
.rolavel{overflow-x:auto}
.num{font-family:var(--dado);font-variant-numeric:tabular-nums}
.sub{color:var(--tinta-suave);font-size:12.5px}

button.acao,.acao{font-family:var(--corpo);font-size:13.5px;padding:6px 13px;border-radius:3px;border:1px solid var(--linha-forte);background:var(--superficie);color:var(--tinta);cursor:pointer}
button.acao:hover:not(:disabled){background:var(--superficie-2);border-color:var(--tinta-suave)}
button.acao:disabled{opacity:.45;cursor:not-allowed}
button.acao.forte{background:var(--oliva);border-color:var(--oliva);color:#fff}
:root[data-theme="dark"] button.acao.forte,:root:not([data-theme="light"]) button.acao.forte{color:#161911}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) button.acao.forte{color:#fff}}
button.acao.forte:hover:not(:disabled){background:var(--oliva-claro);border-color:var(--oliva-claro)}
button.acao.risco{background:var(--alerta);border-color:var(--alerta);color:#fff}
:root[data-theme="dark"] button.acao.risco{color:#2a1512}
button.acao.mini{padding:3px 9px;font-size:12.5px}

input,select,textarea{font-family:var(--corpo);font-size:14px;padding:6px 9px;border:1px solid var(--linha-forte);border-radius:3px;background:var(--superficie);color:var(--tinta);width:100%}
textarea{resize:vertical;min-height:64px;font-size:14px}
label{display:block;font-family:var(--dado);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-suave);margin-bottom:4px}
.controles{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.controles > div{flex:1 1 150px;min-width:130px}
.controles > button{flex:0 0 auto}
.campo{margin-bottom:13px}
.marcavel{display:flex;align-items:center;gap:6px;font-family:var(--corpo);font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--tinta);margin:0}
.marcavel input{width:auto}

.pilula{display:inline-block;font-family:var(--dado);font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap;font-weight:500}
.pilula.bom{background:var(--bom-fundo);color:var(--bom)}
.pilula.info{background:var(--info-fundo);color:var(--info)}
.pilula.atencao{background:var(--atencao-fundo);color:var(--atencao)}
.pilula.alerta{background:var(--alerta-fundo);color:var(--alerta)}
.pilula.neutra{background:var(--superficie-2);color:var(--tinta-suave);border:1px solid var(--linha)}

.nota{padding:9px 13px;border-radius:4px;margin-bottom:14px;font-size:13.5px;border-left:3px solid}
.nota.erro{background:var(--alerta-fundo);border-color:var(--alerta);color:var(--alerta)}
.nota.ok{background:var(--bom-fundo);border-color:var(--bom);color:var(--bom)}
.nota.info{background:var(--info-fundo);border-color:var(--info);color:var(--info)}
.nota:empty{display:none}
.silencio{padding:30px 16px;text-align:center;color:var(--tinta-suave);font-size:13.5px}

/* variação da LPS: marcada por hachura, não por cartão colorido */
.variacao{border:1px solid var(--oliva-claro);border-left-width:4px;background:linear-gradient(135deg,transparent 25%,rgba(109,122,82,.06) 25% 50%,transparent 50% 75%,rgba(109,122,82,.06) 75%);background-size:12px 12px;border-radius:4px;padding:11px 14px;font-size:13px;margin-bottom:18px}
.variacao b{font-family:var(--display);font-size:15px;letter-spacing:.02em;color:var(--oliva)}
.variacao .etapas{font-family:var(--dado);font-size:11.5px;margin-top:6px;color:var(--tinta-suave)}

/* dia da escala: bandas de boletim, sem cartão por linha */
.dia{background:var(--superficie);border:1px solid var(--linha);border-radius:5px;margin-bottom:11px;overflow:hidden;box-shadow:var(--sombra)}
.dia > header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 15px;background:var(--superficie-2);border-bottom:1px solid var(--linha)}
.dia > header .data{font-family:var(--display);font-size:18px;font-weight:700}
.dia > header .semana{font-family:var(--dado);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--tinta-suave);margin-left:7px}
.dia.trancado{border-color:var(--atencao)}
.dia.trancado > header{background:var(--atencao-fundo)}
.posto{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(160px,1.3fr) 92px auto;gap:12px;align-items:center;padding:6px 15px;border-bottom:1px solid var(--linha);font-size:13.5px}
.posto:last-child{border-bottom:0}
.posto.vago{background:var(--alerta-fundo)}
.posto .funcao{font-weight:600}
.posto .obs{font-size:12px;color:var(--tinta-suave);font-style:italic}

.cronologia{list-style:none;margin:0;padding:0}
.cronologia li{border-left:2px solid var(--linha-forte);padding:0 0 15px 15px;position:relative}
.cronologia li::before{content:"";position:absolute;left:-5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--oliva)}
.cronologia li:last-child{border-left-color:transparent;padding-bottom:0}
.cronologia .quando{font-family:var(--dado);font-size:11px;color:var(--tinta-suave)}

.fundo{position:fixed;inset:0;background:rgba(20,23,14,.5);display:flex;align-items:flex-start;justify-content:center;padding:36px 14px;overflow-y:auto;z-index:60}
.janela{background:var(--superficie);border-radius:6px;width:100%;max-width:660px;box-shadow:0 14px 50px rgba(0,0,0,.35);border:1px solid var(--linha)}
.janela > header{padding:12px 17px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;gap:12px}
.janela > header h3{font-size:17px}
.janela > .miolo{padding:17px}
.janela > footer{padding:11px 17px;border-top:1px solid var(--linha);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.janela table th{width:auto}
.janela table td:first-child{font-family:var(--dado);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-suave);white-space:nowrap;width:150px;padding-top:9px}

/* ---------- portaria (login) ---------- */
.portaria{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--oliva-fundo)}
.portaria::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 26px,rgba(255,255,255,.02) 26px 52px);pointer-events:none}
.guarita{background:var(--superficie);border-radius:6px;padding:32px 30px;width:100%;max-width:412px;position:relative;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.guarita .nome{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:.05em;line-height:1;color:var(--oliva)}
.guarita .om{font-family:var(--dado);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-suave);margin:8px 0 24px}
.guarita button.acao.forte{width:100%;margin-top:5px;padding:9px}
.chaves{margin-top:22px;padding-top:15px;border-top:1px dashed var(--linha-forte)}
.chaves .titulo{font-family:var(--dado);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tinta-suave);margin-bottom:8px}
.chaves button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--superficie-2);border:1px solid var(--linha);border-radius:3px;padding:6px 10px;margin-bottom:5px;cursor:pointer;font-family:var(--corpo);font-size:13px;color:var(--tinta)}
.chaves button:hover{border-color:var(--oliva-claro)}
.chaves button span:last-child{font-family:var(--dado);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-suave);white-space:nowrap}

.aviso-demo{background:var(--superficie-2);border-top:1px solid var(--linha);font-size:12.5px;color:var(--tinta-suave);padding:11px 28px;line-height:1.45}
.aviso-demo b{color:var(--tinta)}

@media (max-width:880px){
  #app{flex-direction:column}
  .trilho{width:100%;flex:none;height:auto;position:static}
  .navegacao{display:flex;flex-wrap:wrap;gap:3px;padding:8px}
  .navegacao .secao{width:100%;padding:6px 10px 2px}
  .navegacao button{width:auto;border-left:0;border-radius:3px;padding:5px 10px;font-size:13px}
  .tela{padding:16px 14px 60px}
  .topo{padding:13px 14px}
  .posto{grid-template-columns:1fr;gap:2px}
  .aviso-demo{padding:11px 14px}
}
</style>
<div id="app"></div>

/* =======================================================================
   MilScale — protótipo navegável
   Réplica em navegador do sistema que roda em backend/ + frontend/ deste
   repositório. A separação núcleo × variações é a mesma: o núcleo não sabe
   qual produto está configurado; quem resolve isso é o registro de plugins.
   ======================================================================= */

/* ---------- utilitários de domínio ---------- */
const HOJE = DADOS.gerado_em;
const somarDias = (d, n) => { const r = new Date(d + 'T12:00:00Z'); r.setUTCDate(r.getUTCDate() + n); return r.toISOString().slice(0, 10); };
const difDias = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
const dataBr = (d) => d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : '—';
const dataHoraBr = (v) => v ? dataBr(v.slice(0, 10)) + ' ' + v.slice(11, 16) : '—';
const agora = () => new Date().toISOString().replace('T', ' ').slice(0, 19);
const SEMANA = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const diaSemana = (d) => SEMANA[new Date(d + 'T12:00:00Z').getUTCDay()];
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

class ErroDeNegocio extends Error {}

/* ---------- banco em memória ---------- */
const bd = JSON.parse(JSON.stringify(DADOS));
const proximoId = (tabela, chave) => 1 + bd[tabela].reduce((m, r) => Math.max(m, r[chave]), 0);

const idx = {};
function reindexar() {
  idx.posto = new Map(bd.postos.map((p) => [p.id_posto, p]));
  idx.curso = new Map(bd.cursos.map((c) => [c.id_curso, c]));
  idx.militar = new Map(bd.militares.map((m) => [m.id_militar, m]));
  idx.tipo = new Map(bd.tipos_servico.map((t) => [t.id_tipo_servico, t]));
  idx.dia = new Map(bd.dias.map((d) => [d.id_dia_escala, d]));
  idx.escala = new Map(bd.escalas.map((e) => [e.id_escala, e]));
  idx.servico = new Map(bd.servicos.map((s) => [s.id_servico_escalado, s]));
  idx.usuarioPorMilitar = new Map(bd.usuarios.map((u) => [u.id_militar, u]));
}
reindexar();

const cursosDe = (idMilitar) => bd.militar_curso.filter((v) => v.id_militar === idMilitar).map((v) => v.id_curso);
const requisitosDe = (idTipo) => bd.requisitos.filter((r) => r.id_tipo_servico === idTipo);

function militar(id) {
  const m = idx.militar.get(id);
  if (!m) return null;
  const p = idx.posto.get(m.id_posto);
  return { ...m, sigla_posto: p.sigla, descricao_posto: p.descricao, nivel_hierarquico: p.nivel_hierarquico,
           cursos: cursosDe(id).map((c) => idx.curso.get(c)) };
}
const militares = (f = {}) => bd.militares
  .filter((m) => (!f.situacao || m.situacao === f.situacao) && (!f.idPosto || m.id_posto === f.idPosto)
    && (!f.idCurso || cursosDe(m.id_militar).includes(f.idCurso))
    && (!f.busca || (m.nome_completo + m.nome_guerra + m.cpf).toLowerCase().includes(f.busca.toLowerCase())))
  .map((m) => militar(m.id_militar))
  .sort((a, b) => b.nivel_hierarquico - a.nivel_hierarquico || a.nome_guerra.localeCompare(b.nome_guerra));

const tipoServico = (id) => { const t = idx.tipo.get(id); return t ? { ...t, requisitos: requisitosDe(id).map((r) => ({ ...r, sigla_posto: idx.posto.get(r.id_posto).sigla, nome_curso: r.id_curso ? idx.curso.get(r.id_curso).nome : null })) } : null; };
const tiposServico = (ativos) => bd.tipos_servico.filter((t) => !ativos || t.ativo).map((t) => tipoServico(t.id_tipo_servico)).sort((a, b) => a.nome.localeCompare(b.nome));

function servicoDetalhado(s) {
  const d = idx.dia.get(s.id_dia_escala), e = idx.escala.get(d.id_escala), t = idx.tipo.get(s.id_tipo_servico);
  const m = s.id_militar ? idx.militar.get(s.id_militar) : null;
  return { ...s, data: d.data, trancado: d.trancado, motivo_trancamento: d.motivo_trancamento, id_dia_escala: d.id_dia_escala,
           id_escala: e.id_escala, situacao_escala: e.situacao, nome_tipo_servico: t.nome, hora_inicio: t.hora_inicio,
           duracao_horas: t.duracao_horas, nome_guerra: m ? m.nome_guerra : null, nome_completo: m ? m.nome_completo : null,
           sigla_posto: m ? idx.posto.get(m.id_posto).sigla : null };
}
function servicos(f) {
  return bd.servicos.map(servicoDetalhado)
    .filter((s) => s.data >= f.inicio && s.data <= f.fim
      && (f.incluirRascunho || s.situacao_escala !== 'RASCUNHO')
      && (!f.idTipoServico || s.id_tipo_servico === f.idTipoServico)
      && (!f.idMilitar || s.id_militar === f.idMilitar))
    .sort((a, b) => a.data.localeCompare(b.data) || a.nome_tipo_servico.localeCompare(b.nome_tipo_servico) || String(a.posicao).localeCompare(String(b.posicao)));
}
const diaPorData = (data) => bd.dias.filter((d) => d.data === data)
  .sort((a, b) => ({ PUBLICADA: 0, ENCERRADA: 1, RASCUNHO: 2 }[idx.escala.get(a.id_escala).situacao] - { PUBLICADA: 0, ENCERRADA: 1, RASCUNHO: 2 }[idx.escala.get(b.id_escala).situacao]))[0] || null;
const regraVigente = (idTipo, data) => bd.regras.filter((r) => r.id_tipo_servico === idTipo && r.vigencia_inicio <= data && (!r.vigencia_fim || r.vigencia_fim >= data))
  .sort((a, b) => b.vigencia_inicio.localeCompare(a.vigencia_inicio))[0] || null;
const impedimentoEm = (idMilitar, data) => bd.missoes.find((m) => m.id_militar === idMilitar && m.data_inicio <= data && m.data_fim >= data) || null;
const ultimoServicoAntes = (idMilitar, data) => {
  let u = null;
  for (const s of bd.servicos) {
    if (s.id_militar !== idMilitar || s.situacao === 'SUBSTITUIDO') continue;
    const d = idx.dia.get(s.id_dia_escala).data;
    if (d < data && (!u || d > u)) u = d;
  }
  return u;
};
const servicosNoMes = (idMilitar, anoMes) => bd.servicos.filter((s) => s.id_militar === idMilitar && s.situacao !== 'SUBSTITUIDO' && idx.dia.get(s.id_dia_escala).data.slice(0, 7) === anoMes).length;

/* ---------- núcleo / auditoria ---------- */
function auditar(entidade, idRegistro, acao, anterior, novo) {
  bd.auditoria.unshift({ id_log: proximoId('auditoria', 'id_log'), id_usuario: sessao ? sessao.id_usuario : null,
    entidade, id_registro: idRegistro, acao, valor_anterior: anterior ? JSON.stringify(anterior) : null,
    valor_novo: novo ? JSON.stringify(novo) : null, data_hora: agora() });
}

/* ---------- núcleo / notificação ---------- */
function notificar(idMilitar, tipo, titulo, mensagem, canal = 'SISTEMA') {
  const m = idx.militar.get(idMilitar);
  const falha = canal === 'EMAIL' && !m.email;
  bd.notificacoes.unshift({ id_notificacao: proximoId('notificacoes', 'id_notificacao'), id_militar: idMilitar, tipo,
    titulo, mensagem, canal, data_envio: agora(), situacao_envio: falha ? 'FALHA' : 'ENVIADA' });
}

/* =======================================================================
   NÚCLEO — elegibilidade (UC15)
   O contrato RegraElegibilidade é o ponto de variação RF06 / RF06b.
   ======================================================================= */

/** Variação MilScale (RF06): posto/graduação privativo do serviço + cursos exigidos. */
const regraElegibilidadeHierarquica = {
  identificador: 'HIERARQUIA_MILITAR',
  descricao: 'Elegibilidade por posto/graduação privativo do serviço e cursos exigidos (CFC, Motorista, Rancho).',
  avaliar({ militar: m, tipoServico: t, cursosDoMilitar }) {
    if (!t.requisitos.length) return { apto: true };
    const doPosto = t.requisitos.filter((r) => r.id_posto === m.id_posto);
    if (!doPosto.length) {
      const habilitados = [...new Set(t.requisitos.map((r) => r.sigla_posto))].join(', ');
      return { apto: false, motivo: `Serviço privativo de ${habilitados}; o militar é ${m.sigla_posto}.` };
    }
    const faltando = doPosto.filter((r) => r.id_curso && r.obrigatorio && !cursosDoMilitar.includes(r.id_curso)).map((r) => r.nome_curso);
    if (faltando.length) return { apto: false, motivo: `Curso exigido não concluído: ${faltando.join(', ')}.` };
    return { apto: true };
  }
};

/** Variação SmartScale (RF06b): sem hierarquia privativa, basta a especialidade habilitante. */
const regraElegibilidadePorEspecialidade = {
  identificador: 'ESPECIALIDADE_PREFERENCIA',
  descricao: 'Elegibilidade por especialidade habilitante do profissional, sem hierarquia privativa de cargo.',
  avaliar({ tipoServico: t, cursosDoMilitar }) {
    const exigidas = [...new Set(t.requisitos.filter((r) => r.id_curso).map((r) => r.id_curso))];
    if (!exigidas.length) return { apto: true };
    if (exigidas.some((c) => cursosDoMilitar.includes(c))) return { apto: true };
    return { apto: false, motivo: 'Profissional sem a especialidade exigida para o turno.' };
  }
};

/**
 * UC15 – validador incluído por UC05, UC06 e UC10. As regras comuns à linha de
 * produto ficam aqui; o critério que varia por produto é delegado à regra injetada.
 */
const validador = {
  get regra() { return produto.regraElegibilidade; },

  avaliar(m, t, data, op = {}) {
    if (m.situacao !== 'ATIVO') return { apto: false, motivo: `Militar com situação ${m.situacao}.` };

    const doProduto = this.regra.avaliar({ militar: m, tipoServico: t, data, cursosDoMilitar: m.cursos.map((c) => c.id_curso) });
    if (!doProduto.apto) return doProduto;

    if (op.considerarTrancamento) {                                   // RN04
      const dia = diaPorData(data);
      if (dia && dia.trancado) return { apto: false, motivo: `Dia ${dataBr(data)} trancado: ${dia.motivo_trancamento}.` };
    }

    const imp = impedimentoEm(m.id_militar, data);                    // RN15
    if (imp) return { apto: false, motivo: `${imp.tipo} de ${dataBr(imp.data_inicio)} a ${dataBr(imp.data_fim)}: ${imp.descricao}` };

    const jaEscalado = bd.servicos.some((s) => s.id_militar === m.id_militar && s.situacao !== 'SUBSTITUIDO'
      && idx.dia.get(s.id_dia_escala).data === data && s.id_servico_escalado !== op.ignorarServico);
    if (jaEscalado) return { apto: false, motivo: `Militar já escalado em ${dataBr(data)}.` };   // RN05

    const regra = regraVigente(t.id_tipo_servico, data);
    const ultimo = ultimoServicoAntes(m.id_militar, data);
    if (regra && ultimo && difDias(ultimo, data) < regra.intervalo_minimo) {                     // RN06
      return { apto: false, motivo: `Intervalo mínimo de ${regra.intervalo_minimo} dias não cumprido (último serviço em ${dataBr(ultimo)}).` };
    }
    if (regra && regra.max_servicos_mes && servicosNoMes(m.id_militar, data.slice(0, 7)) >= regra.max_servicos_mes) {
      return { apto: false, motivo: `Limite de ${regra.max_servicos_mes} serviços no mês já atingido.` };
    }

    // RN16: quem encerrou impedimento na véspera segue elegível, mas sem precedência.
    return { apto: true, semPrioridade: Boolean(impedimentoEm(m.id_militar, somarDias(data, -1))) };
  },

  /** UC15-A1 — fila de elegíveis já ordenada pela RN01. */
  elegiveis(idTipo, data, op = {}) {
    const t = tipoServico(idTipo);
    const fila = [];
    for (const m of militares({ situacao: 'ATIVO' })) {
      const r = this.avaliar(m, t, data, op);
      if (!r.apto) continue;
      fila.push({ militar: m, semPrioridade: !!r.semPrioridade,
        diasSemServico: op.contadores ? (op.contadores.get(m.id_militar) ?? m.dias_sem_servico) : m.dias_sem_servico,
        servicosNoMes: servicosNoMes(m.id_militar, data.slice(0, 7)) });
    }
    return fila.sort(ordemDaRotatividade);
  },

  inaptos(idTipo, data, op = {}) {
    const t = tipoServico(idTipo);
    const lista = [];
    for (const m of militares({ situacao: 'ATIVO' })) {
      const r = this.avaliar(m, t, data, op);
      if (!r.apto) lista.push({ militar: m, motivo: r.motivo });
    }
    return lista;
  }
};

/** RN01 — critério de ordenação da rotatividade, isolado para permitir parametrização na LPS. */
function ordemDaRotatividade(a, b) {
  if (a.semPrioridade !== b.semPrioridade) return a.semPrioridade ? 1 : -1;
  if (a.diasSemServico !== b.diasSemServico) return b.diasSemServico - a.diasSemServico;
  if (a.servicosNoMes !== b.servicosNoMes) return a.servicosNoMes - b.servicosNoMes;
  if (a.militar.nivel_hierarquico !== b.militar.nivel_hierarquico) return b.militar.nivel_hierarquico - a.militar.nivel_hierarquico;
  return a.militar.id_militar - b.militar.id_militar;
}

/* =======================================================================
   NÚCLEO — cálculo do ciclo (RN20) e geração da escala (UC05)
   ======================================================================= */

function calcularCiclo({ idTipoServico, nomeTipoServico, efetivoElegivel, efetivoDiarioExigido, regra }) {
  const diasServico = regra.dias_servico > 0 ? regra.dias_servico : 1;
  const rodadas = Math.floor(efetivoElegivel / Math.max(efetivoDiarioExigido, 1));
  const cicloCalculado = Math.max(rodadas - diasServico, 0);
  const limiteMax = regra.ciclo_maximo ?? cicloCalculado;
  const cicloAplicado = Math.min(Math.max(cicloCalculado, 0), limiteMax);
  const abaixo = cicloCalculado < regra.ciclo_minimo;
  return { idTipoServico, nomeTipoServico, efetivoElegivel, efetivoDiarioExigido, cicloCalculado, cicloAplicado,
    diasServico, proporcao: `${cicloAplicado}x${diasServico}`, abaixoDoMinimo: abaixo,
    alerta: abaixo ? `Ciclo apurado ${cicloCalculado}x${diasServico} é inferior ao mínimo ${regra.ciclo_minimo}x${diasServico} da regra vigente: o efetivo disponível (${efetivoElegivel}) não sustenta o intervalo desejado.` : null };
}

function gerarEscala({ dataInicio, dataFim, descricao, idTipoServico, confirmarCiclo, substituirRascunho }) {
  const inicio = Date.now();
  if (dataFim < dataInicio) throw new ErroDeNegocio('A data final não pode anteceder a inicial.');
  if (difDias(dataInicio, dataFim) > 91) throw new ErroDeNegocio('O período de geração está limitado a 92 dias.');

  const publicada = bd.escalas.find((e) => e.situacao !== 'RASCUNHO' && e.data_inicio <= dataFim && e.data_fim >= dataInicio);
  if (publicada) throw new ErroDeNegocio(`Já existe a escala "${publicada.descricao}" publicada sobre este período. Use a alteração manual (UC06) para ajustes pontuais.`);
  const rascunho = bd.escalas.find((e) => e.situacao === 'RASCUNHO' && e.data_inicio <= dataFim && e.data_fim >= dataInicio);
  if (rascunho && !substituirRascunho) throw new ErroDeNegocio(`Já existe o rascunho "${rascunho.descricao}" para este período. Descarte-o para gerar novamente.`, 'RASCUNHO');

  const tipos = idTipoServico ? [tipoServico(idTipoServico)] : tiposServico(true);
  const alertas = [], ciclos = [], comRegra = [];

  for (const t of tipos) {
    const regra = regraVigente(t.id_tipo_servico, dataInicio);
    if (!regra) { alertas.push(`Sem regra vigente para "${t.nome}": o serviço não foi escalado.`); continue; }
    let elegivel = 0;
    for (const m of militares({ situacao: 'ATIVO' })) {
      if (!produto.regraElegibilidade.avaliar({ militar: m, tipoServico: t, data: dataInicio, cursosDoMilitar: m.cursos.map((c) => c.id_curso) }).apto) continue;
      const preso = bd.missoes.some((ms) => ms.id_militar === m.id_militar && ms.data_inicio <= dataInicio && ms.data_fim >= dataFim);
      if (!preso) elegivel += 1;
    }
    const ciclo = calcularCiclo({ idTipoServico: t.id_tipo_servico, nomeTipoServico: t.nome, efetivoElegivel: elegivel, efetivoDiarioExigido: t.efetivo_necessario, regra });
    ciclos.push(ciclo);
    if (ciclo.alerta) alertas.push(ciclo.alerta);
    comRegra.push(t);
  }
  if (!comRegra.length) throw new ErroDeNegocio('Nenhum tipo de serviço possui regra vigente no período.');

  const abaixo = ciclos.filter((c) => c.abaixoDoMinimo);
  if (abaixo.length && !confirmarCiclo) {
    throw new ErroDeNegocio('Efetivo insuficiente para manter o ciclo mínimo em: ' + abaixo.map((c) => c.nomeTipoServico).join(', ') + '. Confirme a geração para prosseguir mesmo assim.', 'CICLO');
  }

  if (rascunho) descartarRascunho(rascunho.id_escala);

  const idEscala = proximoId('escalas', 'id_escala');
  bd.escalas.push({ id_escala: idEscala, descricao: descricao || `Escala ${dataBr(dataInicio)} a ${dataBr(dataFim)}`,
    data_inicio: dataInicio, data_fim: dataFim, situacao: 'RASCUNHO', data_geracao: agora(), id_usuario_geracao: sessao.id_usuario });
  reindexar();

  const contadores = new Map(militares({ situacao: 'ATIVO' }).map((m) => [m.id_militar, m.dias_sem_servico]));
  const pendencias = [];
  let total = 0;

  for (let data = dataInicio; data <= dataFim; data = somarDias(data, 1)) {
    const idDia = proximoId('dias', 'id_dia_escala');
    bd.dias.push({ id_dia_escala: idDia, id_escala: idEscala, data, trancado: 0, motivo_trancamento: null, id_usuario_trancamento: null, data_trancamento: null });
    reindexar();
    const noDia = new Set();

    for (const t of comRegra) {
      for (let vaga = 1; vaga <= t.efetivo_necessario; vaga += 1) {
        const posicao = t.efetivo_necessario > 1 ? `${t.nome} ${vaga}` : t.nome;
        const escolhido = validador.elegiveis(t.id_tipo_servico, data, { contadores })[0];
        const id = proximoId('servicos', 'id_servico_escalado');
        if (!escolhido) {
          bd.servicos.push({ id_servico_escalado: id, id_dia_escala: idDia, id_tipo_servico: t.id_tipo_servico, id_militar: null,
            posicao, situacao: 'PREVISTO', observacao: 'Pendente: sem militar elegível e disponível.' });
          pendencias.push({ data, posicao, motivo: 'Sem militar elegível e disponível na data.' });
        } else {
          bd.servicos.push({ id_servico_escalado: id, id_dia_escala: idDia, id_tipo_servico: t.id_tipo_servico,
            id_militar: escolhido.militar.id_militar, posicao, situacao: 'PREVISTO',
            observacao: escolhido.semPrioridade ? 'Retorno de impedimento, sem prioridade (RN16).' : null });
          total += 1;
          noDia.add(escolhido.militar.id_militar);
        }
        reindexar();
      }
    }
    for (const [id, v] of contadores) contadores.set(id, noDia.has(id) ? 0 : v + 1);   // RF09
  }

  auditar('ESCALA', idEscala, 'INCLUSAO', null, { periodo: `${dataInicio} a ${dataFim}`, servicos: total, pendencias: pendencias.length });
  return { idEscala, descricao: idx.escala.get(idEscala).descricao, periodo: { inicio: dataInicio, fim: dataFim },
    ciclos, totalServicosGerados: total, totalPendencias: pendencias.length, pendencias, alertas, duracaoMs: Date.now() - inicio };
}

function publicarEscala(idEscala) {
  const e = idx.escala.get(idEscala);
  if (!e) throw new ErroDeNegocio('Escala não encontrada.');
  if (e.situacao !== 'RASCUNHO') throw new ErroDeNegocio('Somente escalas em rascunho podem ser publicadas.');
  e.situacao = 'PUBLICADA';
  const envolvidos = new Set(bd.servicos.filter((s) => s.id_militar && idx.dia.get(s.id_dia_escala).id_escala === idEscala).map((s) => s.id_militar));
  for (const id of envolvidos) {
    const meus = servicos({ inicio: e.data_inicio, fim: e.data_fim, idMilitar: id });
    notificar(id, 'ESCALA_PUBLICADA', 'Escala publicada',
      `A escala do período foi publicada. Você tem ${meus.length} serviço(s) previsto(s), a começar por ${dataBr(meus[0] ? meus[0].data : e.data_inicio)}.`);
  }
  // RF09 — consolida o contador de dias sem serviço no cadastro.
  for (const m of bd.militares) {
    if (m.situacao !== 'ATIVO') continue;
    const u = ultimoServicoAntes(m.id_militar, somarDias(e.data_fim, 1));
    if (u) m.dias_sem_servico = Math.max(difDias(u, e.data_fim), 0);
  }
  auditar('ESCALA', idEscala, 'ALTERACAO', { situacao: 'RASCUNHO' }, { situacao: 'PUBLICADA' });
  return envolvidos.size;
}

function descartarRascunho(idEscala) {
  const e = idx.escala.get(idEscala);
  if (!e || e.situacao !== 'RASCUNHO') throw new ErroDeNegocio('Apenas rascunhos podem ser descartados.');
  const dias = bd.dias.filter((d) => d.id_escala === idEscala).map((d) => d.id_dia_escala);
  bd.servicos = bd.servicos.filter((s) => !dias.includes(s.id_dia_escala));
  bd.dias = bd.dias.filter((d) => d.id_escala !== idEscala);
  bd.escalas = bd.escalas.filter((x) => x.id_escala !== idEscala);
  reindexar();
  auditar('ESCALA', idEscala, 'EXCLUSAO', e, null);
}

/* =======================================================================
   NÚCLEO — escala: alteração manual (UC06) e trancamento (UC07)
   ======================================================================= */

function alterarServico(idServico, idSubstituto, justificativa) {
  const s = servicoDetalhado(idx.servico.get(idServico));
  if (!justificativa || justificativa.trim().length < 5) throw new ErroDeNegocio('A justificativa é obrigatória na alteração manual.');
  if (s.trancado) throw new ErroDeNegocio(`Dia trancado pela sargenteação: ${s.motivo_trancamento}`);
  if (s.situacao_escala === 'ENCERRADA') throw new ErroDeNegocio('Escala encerrada não aceita alterações.');

  if (idSubstituto) {
    const m = militar(idSubstituto), t = tipoServico(s.id_tipo_servico);
    const r = validador.avaliar(m, t, s.data, { ignorarServico: idServico });
    if (!r.apto) throw new ErroDeNegocio(`${m.sigla_posto} ${m.nome_guerra} não pode assumir este serviço. ${r.motivo}`);
  }

  const bruto = idx.servico.get(idServico);
  const anterior = bruto.id_militar;
  bruto.id_militar = idSubstituto;
  bruto.observacao = idSubstituto ? `Alteração manual: ${justificativa}` : `Removido sem substituto: ${justificativa}`;
  auditar('SERVICO_ESCALADO', idServico, 'ALTERACAO', { id_militar: anterior }, { id_militar: idSubstituto, justificativa });

  if (anterior) notificar(anterior, 'STATUS_SOLICITACAO', 'Alteração na escala', `Você foi retirado do serviço de ${s.nome_tipo_servico} em ${dataBr(s.data)}. Motivo: ${justificativa}`);
  if (idSubstituto) notificar(idSubstituto, 'STATUS_SOLICITACAO', 'Alteração na escala', `Você foi escalado para ${s.nome_tipo_servico} em ${dataBr(s.data)}. Motivo: ${justificativa}`);
}

function trancarDia(idDia, motivo, indeferirPendentes) {
  const dia = idx.dia.get(idDia);
  if (!dia) throw new ErroDeNegocio('Dia da escala não encontrado.');
  if (dia.trancado) throw new ErroDeNegocio('Dia já se encontra trancado.');
  if (dia.data < HOJE) throw new ErroDeNegocio('Não é permitido trancar data anterior à data atual.');
  if (!motivo || !motivo.trim()) throw new ErroDeNegocio('Informe o motivo do trancamento.');

  const pendentes = bd.solicitacoes.filter((s) => ['EM_ANALISE_CABO', 'AGUARDANDO_SARGENTEANTE'].includes(s.situacao)
    && idx.servico.get(s.id_servico_escalado) && idx.servico.get(s.id_servico_escalado).id_dia_escala === idDia);
  if (pendentes.length && !indeferirPendentes) {
    throw new ErroDeNegocio(`Existem ${pendentes.length} solicitação(ões) pendente(s) para esta data. Decida-as antes ou confirme o indeferimento automático.`, 'PENDENTES');
  }
  for (const p of pendentes) {
    p.situacao = 'NEGADA';
    bd.pareceres.push({ id_parecer: proximoId('pareceres', 'id_parecer'), id_solicitacao: p.id_solicitacao,
      id_usuario_avaliador: sessao.id_usuario, etapa: 'AUTORIZACAO', resultado: 'NEGADA',
      justificativa: `Indeferida automaticamente: dia trancado (${motivo}).`, data_parecer: agora() });
    notificar(p.id_militar_solicitante, 'STATUS_SOLICITACAO', 'Solicitação de troca atualizada', `Sua solicitação foi negada: o dia ${dataBr(dia.data)} foi trancado pela sargenteação.`);
  }
  Object.assign(dia, { trancado: 1, motivo_trancamento: motivo, id_usuario_trancamento: sessao.id_usuario, data_trancamento: agora() });
  auditar('DIA_ESCALA', idDia, 'ALTERACAO', { trancado: false }, { trancado: true, motivo, solicitacoesIndeferidas: pendentes.length });
  return pendentes.length;
}

function destrancarDia(idDia, justificativa) {
  const dia = idx.dia.get(idDia);
  if (!dia || !dia.trancado) throw new ErroDeNegocio('Dia não está trancado.');
  const motivoAnterior = dia.motivo_trancamento;
  Object.assign(dia, { trancado: 0, motivo_trancamento: null, id_usuario_trancamento: null, data_trancamento: null });
  auditar('DIA_ESCALA', idDia, 'ALTERACAO', { trancado: true, motivo: motivoAnterior }, { trancado: false, justificativa });
}

/* =======================================================================
   NÚCLEO — trocas: máquina de estados (ativo reutilizável 4)
   ======================================================================= */

const transicoes = {
  EM_ANALISE_CABO: ['AGUARDANDO_SARGENTEANTE', 'AUTORIZADA', 'NEGADA', 'CANCELADA'],
  AGUARDANDO_SARGENTEANTE: ['AUTORIZADA', 'NEGADA', 'EM_ANALISE_CABO'],
  AUTORIZADA: [], NEGADA: [], CANCELADA: []
};
const rotuloSituacao = {
  EM_ANALISE_CABO: 'Em análise pelo cabo',
  AGUARDANDO_SARGENTEANTE: 'Aguardando autorização do sargenteante',
  AUTORIZADA: 'Autorizada', NEGADA: 'Negada', CANCELADA: 'Cancelada'
};
const corSituacao = { EM_ANALISE_CABO: 'atencao', AGUARDANDO_SARGENTEANTE: 'info', AUTORIZADA: 'bom', NEGADA: 'alerta', CANCELADA: 'neutra',
  PUBLICADA: 'bom', RASCUNHO: 'atencao', ENCERRADA: 'neutra', ATIVO: 'bom', AFASTADO: 'atencao', DESLIGADO: 'alerta',
  PREVISTO: 'info', CUMPRIDO: 'bom', SUBSTITUIDO: 'neutra', ENVIADA: 'info', LIDA: 'bom', FALHA: 'alerta',
  MISSAO: 'info', DISPENSA: 'atencao', FERIAS: 'bom', OUTRO: 'neutra' };

/* -----------------------------------------------------------------------
   FEATURE EXCLUSIVA DO MILSCALE — RF12b / RN08 / UC11 + UC12
   Aprovação em duas etapas encadeadas. O núcleo abaixo (avaliarSolicitacao)
   não sabe quantas etapas existem: pergunta à estratégia.
   ----------------------------------------------------------------------- */
const estrategiaAprovacaoEmCadeia = {
  identificador: 'CADEIA_DUAS_ETAPAS',
  descricao: 'Dupla avaliação: triagem de viabilidade do cabo da sargenteação e autorização final do sargenteante.',
  cadeia: [
    { ordem: 1, etapa: 'TRIAGEM', situacaoAguardando: 'EM_ANALISE_CABO', perfilResponsavel: 'CABO_SARGENTEACAO',
      rotulo: 'Triagem de viabilidade (cabo da sargenteação)', decisoesPossiveis: ['APROVAR', 'RECUSAR'] },
    { ordem: 2, etapa: 'AUTORIZACAO', situacaoAguardando: 'AGUARDANDO_SARGENTEANTE', perfilResponsavel: 'SARGENTEANTE',
      rotulo: 'Autorização final (sargenteante)', decisoesPossiveis: ['APROVAR', 'RECUSAR', 'DEVOLVER'] }
  ],
  situacaoInicial() { return this.cadeia[0].situacaoAguardando; },
  etapas() { return this.cadeia; },
  etapaCorrente(situacao) { return this.cadeia.find((e) => e.situacaoAguardando === situacao) || null; },
  avaliar({ solicitacao, decisao }) {
    const atual = this.etapaCorrente(solicitacao.situacao);
    if (!atual) throw new ErroDeNegocio('A solicitação já foi decidida e não aceita novo parecer.');
    if (!atual.decisoesPossiveis.includes(decisao)) throw new ErroDeNegocio(`Decisão "${decisao}" indisponível nesta etapa.`);

    let r;
    if (decisao === 'RECUSAR') r = { novaSituacao: 'NEGADA', resultadoParecer: atual.etapa === 'TRIAGEM' ? 'DESFAVORAVEL' : 'NEGADA', aplicarTrocaNaEscala: false };
    else if (decisao === 'DEVOLVER') r = { novaSituacao: 'EM_ANALISE_CABO', resultadoParecer: 'DESFAVORAVEL', aplicarTrocaNaEscala: false };
    else {
      const proxima = this.cadeia.find((e) => e.ordem === atual.ordem + 1);
      r = proxima ? { novaSituacao: proxima.situacaoAguardando, resultadoParecer: 'FAVORAVEL', aplicarTrocaNaEscala: false }
                  : { novaSituacao: 'AUTORIZADA', resultadoParecer: 'AUTORIZADA', aplicarTrocaNaEscala: true };
    }
    if (!transicoes[solicitacao.situacao].includes(r.novaSituacao)) throw new ErroDeNegocio(`Transição inválida de ${solicitacao.situacao} para ${r.novaSituacao}.`);
    return { ...r, etapa: atual.etapa };
  }
};

/** Variação SmartScale (RF12): o coordenador do plantão decide em etapa única. */
const estrategiaAprovacaoUnica = {
  identificador: 'ETAPA_UNICA',
  descricao: 'Aprovação em etapa única pelo coordenador responsável pelo turno.',
  unica: { ordem: 1, etapa: 'AUTORIZACAO', situacaoAguardando: 'AGUARDANDO_SARGENTEANTE', perfilResponsavel: 'SARGENTEANTE',
           rotulo: 'Decisão do coordenador', decisoesPossiveis: ['APROVAR', 'RECUSAR'] },
  situacaoInicial() { return this.unica.situacaoAguardando; },
  etapas() { return [this.unica]; },
  etapaCorrente(situacao) { return situacao === this.unica.situacaoAguardando ? this.unica : null; },
  avaliar({ solicitacao, decisao }) {
    if (!this.etapaCorrente(solicitacao.situacao)) throw new ErroDeNegocio('A solicitação já foi decidida e não aceita novo parecer.');
    return decisao === 'RECUSAR'
      ? { novaSituacao: 'NEGADA', resultadoParecer: 'NEGADA', aplicarTrocaNaEscala: false, etapa: 'AUTORIZACAO' }
      : { novaSituacao: 'AUTORIZADA', resultadoParecer: 'AUTORIZADA', aplicarTrocaNaEscala: true, etapa: 'AUTORIZACAO' };
  }
};

/* =======================================================================
   REGISTRO DE PLUGINS — único ponto que conhece os dois catálogos
   ======================================================================= */
const catalogoDeProdutos = {
  MILSCALE: { codigo: 'MILSCALE', nome: 'MilScale', unidade: '5º Batalhão de Infantaria — Curitiba/PR',
    regraElegibilidade: regraElegibilidadeHierarquica, estrategiaAprovacaoTroca: estrategiaAprovacaoEmCadeia },
  SMARTSCALE: { codigo: 'SMARTSCALE', nome: 'SmartScale', unidade: 'Produto hospitalar da mesma linha de produto',
    regraElegibilidade: regraElegibilidadePorEspecialidade, estrategiaAprovacaoTroca: estrategiaAprovacaoUnica }
};
let produto = catalogoDeProdutos.MILSCALE;

/* =======================================================================
   NÚCLEO — solicitação de troca (UC10 a UC13, UC19)
   ======================================================================= */

function solicitacaoDetalhada(s) {
  const serv = servicoDetalhado(idx.servico.get(s.id_servico_escalado));
  const sol = idx.militar.get(s.id_militar_solicitante);
  const sub = s.id_militar_substituto ? idx.militar.get(s.id_militar_substituto) : null;
  return { ...s, data_servico: serv.data, trancado: serv.trancado, id_dia_escala: serv.id_dia_escala,
    id_tipo_servico: serv.id_tipo_servico, nome_tipo_servico: serv.nome_tipo_servico, hora_inicio: serv.hora_inicio,
    posicao: serv.posicao, solicitante_nome_guerra: sol.nome_guerra, solicitante_posto: idx.posto.get(sol.id_posto).sigla,
    substituto_nome_guerra: sub ? sub.nome_guerra : null, substituto_posto: sub ? idx.posto.get(sub.id_posto).sigla : null,
    rotulo_situacao: rotuloSituacao[s.situacao],
    etapa_atual: produto.estrategiaAprovacaoTroca.etapaCorrente(s.situacao)?.rotulo ?? null };
}
const solicitacoes = (f = {}) => bd.solicitacoes
  .filter((s) => (!f.situacao || s.situacao === f.situacao) && (!f.idSolicitante || s.id_militar_solicitante === f.idSolicitante))
  .map(solicitacaoDetalhada)
  .sort((a, b) => a.data_servico.localeCompare(b.data_servico));

/** UC10 pré-condições: serviço futuro, dia destrancado (RN04), 24 h de antecedência (RN12). */
function podeSolicitarTroca(s) {
  if (s.situacao !== 'PREVISTO') return { permitido: false, motivo: 'Serviço já cumprido ou substituído.' };
  if (s.trancado) return { permitido: false, motivo: `Dia trancado: ${s.motivo_trancamento}` };
  if (s.situacao_escala !== 'PUBLICADA') return { permitido: false, motivo: 'A escala do período ainda não foi publicada.' };
  if (difDias(HOJE, s.data) < 1) return { permitido: false, motivo: 'Antecedência mínima de 24 horas não cumprida.' };
  if (bd.solicitacoes.some((x) => x.id_servico_escalado === s.id_servico_escalado && ['EM_ANALISE_CABO', 'AGUARDANDO_SARGENTEANTE'].includes(x.situacao)))
    return { permitido: false, motivo: 'Já existe solicitação em andamento para este serviço.' };
  return { permitido: true };
}

const substitutosPossiveis = (idServico) => {
  const s = servicoDetalhado(idx.servico.get(idServico));
  return validador.elegiveis(s.id_tipo_servico, s.data, { ignorarServico: idServico }).filter((e) => e.militar.id_militar !== s.id_militar);
};

function registrarSolicitacao(idServico, idSubstituto, motivo) {
  const s = servicoDetalhado(idx.servico.get(idServico));
  if (s.id_militar !== sessao.id_militar) throw new ErroDeNegocio('Só é possível solicitar a troca de um serviço em que você está escalado.');
  if (!motivo || motivo.trim().length < 5) throw new ErroDeNegocio('Informe o motivo da solicitação.');
  const p = podeSolicitarTroca(s);
  if (!p.permitido) throw new ErroDeNegocio(p.motivo);
  if (idSubstituto) exigirSubstitutoElegivel(idSubstituto, s.id_tipo_servico, s.data, idServico);

  const situacao = produto.estrategiaAprovacaoTroca.situacaoInicial();
  const id = proximoId('solicitacoes', 'id_solicitacao');
  bd.solicitacoes.push({ id_solicitacao: id, id_servico_escalado: idServico, id_militar_solicitante: sessao.id_militar,
    id_militar_substituto: idSubstituto || null, motivo, data_solicitacao: agora(), situacao });
  auditar('SOLICITACAO_TROCA', id, 'INCLUSAO', null, { servico: `${s.nome_tipo_servico} em ${s.data}`, situacao });
  notificar(sessao.id_militar, 'STATUS_SOLICITACAO', 'Solicitação registrada',
    `Sua solicitação de troca do serviço de ${s.nome_tipo_servico} em ${dataBr(s.data)} está em "${rotuloSituacao[situacao]}".`);
  return id;
}

function exigirSubstitutoElegivel(idSubstituto, idTipo, data, idServico) {
  const m = militar(idSubstituto), t = tipoServico(idTipo);
  const r = validador.avaliar(m, t, data, { ignorarServico: idServico, considerarTrancamento: true });
  if (!r.apto) throw new ErroDeNegocio(`${m.sigla_posto} ${m.nome_guerra} não pode assumir o serviço: ${r.motivo}`);
}

/** UC11 e UC12 — um método só; a etapa e o perfil responsável vêm da estratégia. */
function avaliarSolicitacao(idSolicitacao, decisao, justificativa, idSubstitutoSugerido) {
  const s = bd.solicitacoes.find((x) => x.id_solicitacao === idSolicitacao);
  if (!s) throw new ErroDeNegocio('Solicitação não encontrada.');
  if (!justificativa || justificativa.trim().length < 5) throw new ErroDeNegocio('A justificativa do parecer é obrigatória.');

  const etapa = produto.estrategiaAprovacaoTroca.etapaCorrente(s.situacao);
  if (!etapa) throw new ErroDeNegocio(`A solicitação está em "${rotuloSituacao[s.situacao]}" e não aguarda parecer.`);
  if (!perfilAtende(sessao.perfil, etapa.perfilResponsavel)) throw new ErroDeNegocio(`Esta etapa (${etapa.rotulo}) é privativa do perfil ${etapa.perfilResponsavel}.`);

  const serv = servicoDetalhado(idx.servico.get(s.id_servico_escalado));
  if (serv.trancado && decisao === 'APROVAR') throw new ErroDeNegocio(`Dia trancado pela sargenteação: ${serv.motivo_trancamento}`);

  let idSubstituto = idSubstitutoSugerido || s.id_militar_substituto;
  const r = produto.estrategiaAprovacaoTroca.avaliar({ solicitacao: s, decisao });

  if (r.aplicarTrocaNaEscala) {
    if (!idSubstituto) throw new ErroDeNegocio('A troca não pode ser autorizada sem um substituto indicado.');
    exigirSubstitutoElegivel(idSubstituto, serv.id_tipo_servico, serv.data, serv.id_servico_escalado);   // RN07
  }

  bd.pareceres.push({ id_parecer: proximoId('pareceres', 'id_parecer'), id_solicitacao: idSolicitacao,
    id_usuario_avaliador: sessao.id_usuario, etapa: r.etapa, resultado: r.resultadoParecer, justificativa, data_parecer: agora() });
  s.situacao = r.novaSituacao;
  s.id_militar_substituto = idSubstituto;

  if (r.aplicarTrocaNaEscala) {                                        // RN09
    const bruto = idx.servico.get(serv.id_servico_escalado);
    bruto.id_militar = idSubstituto;
    bruto.observacao = `Troca autorizada (solicitação ${idSolicitacao}).`;
    for (const id of [s.id_militar_solicitante, idSubstituto]) {
      const u = ultimoServicoAntes(id, somarDias(serv.data, 1));
      if (u) idx.militar.get(id).dias_sem_servico = Math.max(difDias(u, serv.data), 0);
    }
    notificar(idSubstituto, 'STATUS_SOLICITACAO', 'Você assumiu um serviço',
      `Você foi confirmado no serviço de ${serv.nome_tipo_servico} em ${dataBr(serv.data)}, às ${serv.hora_inicio}.`);
  }
  auditar('SOLICITACAO_TROCA', idSolicitacao, 'ALTERACAO', { situacao: etapa.situacaoAguardando },
    { situacao: r.novaSituacao, etapa: r.etapa, resultado: r.resultadoParecer, justificativa });
  notificar(s.id_militar_solicitante, 'STATUS_SOLICITACAO', 'Solicitação de troca atualizada',
    `Sua solicitação do serviço de ${serv.nome_tipo_servico} em ${dataBr(serv.data)} está agora em "${rotuloSituacao[r.novaSituacao]}".`);
}

function cancelarSolicitacao(idSolicitacao) {
  const s = bd.solicitacoes.find((x) => x.id_solicitacao === idSolicitacao);
  if (s.id_militar_solicitante !== sessao.id_militar) throw new ErroDeNegocio('Só o próprio solicitante pode cancelar.');
  if (s.situacao !== produto.estrategiaAprovacaoTroca.situacaoInicial())
    throw new ErroDeNegocio(`A solicitação está em "${rotuloSituacao[s.situacao]}" e não pode mais ser cancelada.`);
  s.situacao = 'CANCELADA';
  auditar('SOLICITACAO_TROCA', idSolicitacao, 'ALTERACAO', null, { situacao: 'CANCELADA' });
}

const ORDEM_PERFIS = ['MILITAR_ESCALADO', 'SD_EP_SARGENTEACAO', 'CABO_SARGENTEACAO', 'SARGENTEANTE'];
const perfilAtende = (usuario, exigido) => ORDEM_PERFIS.indexOf(usuario) >= ORDEM_PERFIS.indexOf(exigido);

const ACRESCIMOS = {
  MILITAR_ESCALADO: ['ESCALA_CONSULTAR_PROPRIA', 'SOLICITACAO_REGISTRAR', 'SOLICITACAO_CONSULTAR_PROPRIA'],
  SD_EP_SARGENTEACAO: ['ESCALA_CONSULTAR_COMPLETA', 'SOLICITACAO_CONSULTAR_TODAS', 'HISTORICO_CONSULTAR', 'ESCALA_EXPORTAR'],
  CABO_SARGENTEACAO: ['ESCALA_GERAR', 'ESCALA_PUBLICAR', 'SOLICITACAO_TRIAR'],
  SARGENTEANTE: ['MILITAR_MANTER', 'TIPO_SERVICO_MANTER', 'REGRA_MANTER', 'MISSAO_MANTER', 'ESCALA_ALTERAR',
                 'DIA_TRANCAR', 'SOLICITACAO_AUTORIZAR', 'AUDITORIA_CONSULTAR', 'NOTIFICACAO_DISPARAR']
};
const permissoesDoPerfil = (perfil) => ORDEM_PERFIS.slice(0, ORDEM_PERFIS.indexOf(perfil) + 1).flatMap((n) => ACRESCIMOS[n]);

let sessao = null;
const pode = (...codigos) => !!sessao && codigos.some((c) => sessao.permissoes.includes(c));

function entrar(login) {
  const u = bd.usuarios.find((x) => x.login === login);
  if (!u) throw new ErroDeNegocio('CPF ou senha inválidos.');
  const m = militar(u.id_militar);
  const perfil = bd.perfis.find((p) => p.id_perfil === u.id_perfil).nome;
  sessao = { id_usuario: u.id_usuario, id_militar: u.id_militar, login: u.login, perfil,
    nome_guerra: m.nome_guerra, nome_completo: m.nome_completo, sigla_posto: m.sigla_posto,
    permissoes: permissoesDoPerfil(perfil) };
  auditar('USUARIO', u.id_usuario, 'ACESSO', null, { login, perfil });
}

/* UC20 — rotina temporizada de apuração dos militares de serviço no dia seguinte. */
function rotinaD1(dataReferencia) {
  const alvo = somarDias(dataReferencia, 1);
  const doDia = servicos({ inicio: alvo, fim: alvo });
  if (!doDia.length) return { alvo, observacao: 'Não há escala publicada para o dia seguinte; rotina encerrada sem envio.' };

  let apurados = 0, enviadas = 0, repetidas = 0;
  const falhas = [];
  for (const s of doDia) {
    if (!s.id_militar) continue;
    if (bd.solicitacoes.some((x) => x.id_servico_escalado === s.id_servico_escalado && ['EM_ANALISE_CABO', 'AGUARDANDO_SARGENTEANTE'].includes(x.situacao))) continue;
    apurados += 1;
    const referencia = `${dataBr(alvo)} - ${s.nome_tipo_servico}`;
    if (bd.notificacoes.some((n) => n.id_militar === s.id_militar && n.tipo === 'SERVICO_D1' && n.mensagem.includes(referencia) && n.situacao_envio !== 'FALHA')) { repetidas += 1; continue; }
    const m = idx.militar.get(s.id_militar);
    if (!m.email) falhas.push({ quem: `${s.sigla_posto} ${s.nome_guerra}`, motivo: 'Militar sem contato de e-mail cadastrado.' });
    notificar(s.id_militar, 'SERVICO_D1', 'Serviço amanhã',
      `Você está escalado para ${referencia}${s.posicao ? ` na posição ${s.posicao}` : ''}, com apresentação às ${s.hora_inicio}. Turno de ${s.duracao_horas} horas.`);
    enviadas += 1;
  }
  return { alvo, apurados, enviadas, repetidas, falhas };
}

/* ---------- UC08 minha escala + UC10 solicitar troca ---------- */

/* ---------- UC09 escala completa + UC06 alteração manual ---------- */
TELAS.escala = () => {
  const inicio = f('esInicio', primeiroDoMes()), fim = f('esFim', ultimoDoMes());
  const idTipo = Number(f('esTipo', 0)) || null;
  const rascunho = f('esRascunho', false);
  const lista = servicos({ inicio, fim, idTipoServico: idTipo, incluirRascunho: rascunho });
  const porData = new Map();
  for (const s of lista) { if (!porData.has(s.data)) porData.set(s.data, []); porData.get(s.data).push(s); }

  return `
    <section class="bloco"><div class="miolo"><div class="controles">
      <div><label>De</label><input type="date" data-filtro="esInicio" value="${inicio}"></div>
      <div><label>Até</label><input type="date" data-filtro="esFim" value="${fim}"></div>
      <div><label>Tipo de serviço</label><select data-filtro="esTipo"><option value="0">Todos</option>
        ${tiposServico().map((t) => `<option value="${t.id_tipo_servico}" ${idTipo === t.id_tipo_servico ? 'selected' : ''}>${esc(t.nome)}</option>`).join('')}</select></div>
      <div style="flex:0 0 auto"><label class="marcavel"><input type="checkbox" data-filtro-bool="esRascunho" ${rascunho ? 'checked' : ''}> Incluir rascunhos</label></div>
      ${pode('ESCALA_EXPORTAR') ? '<button class="acao" data-imprimir="1">Exportar / imprimir</button>' : ''}
    </div></div></section>
    ${porData.size ? [...porData.entries()].map(([data, itens]) => `
      <article class="dia ${itens[0].trancado ? 'trancado' : ''}">
        <header>
          <div><span class="data num">${dataBr(data)}</span><span class="semana">${diaSemana(data)}</span></div>
          <div style="display:flex;gap:7px;flex-wrap:wrap">
            ${pilula(itens[0].situacao_escala)}
            ${itens[0].trancado ? pilula('NEGADA', 'trancado: ' + itens[0].motivo_trancamento) : ''}
            ${itens.filter((s) => !s.id_militar).length ? pilula('AGUARDANDO_SARGENTEANTE', itens.filter((s) => !s.id_militar).length + ' pendência(s)') : ''}
          </div>
        </header>
        ${itens.map((s) => `<div class="posto ${s.id_militar ? '' : 'vago'}">
          <div><span class="funcao">${esc(s.posicao || s.nome_tipo_servico)}</span>
            ${s.observacao ? `<div class="obs">${esc(s.observacao)}</div>` : ''}</div>
          <div>${s.id_militar ? `${esc(nome(s))}<div class="sub">${esc(s.nome_completo)}</div>` : pilula('NEGADA', 'vaga pendente')}</div>
          <div class="sub num">${esc(s.hora_inicio)} · ${s.duracao_horas}h</div>
          <div>${pode('ESCALA_ALTERAR') && !s.trancado ? `<button class="acao mini" data-alterar="${s.id_servico_escalado}">Alterar</button>` : ''}</div>
        </div>`).join('')}
      </article>`).join('')
      : '<section class="bloco"><div class="silencio">Não há escala registrada no período informado.</div></section>'}`;
};

        </div>

/* ---------- UC07 trancamento ---------- */

  const inicio = f('tInicio', HOJE), fim = f('tFim', somarDias(HOJE, 30));
  const dias = bd.dias.filter((d) => d.data >= inicio && d.data <= fim).sort((a, b) => a.data.localeCompare(b.data));
  return `
    <section class="bloco"><div class="miolo">
      <div class="controles">
        <div><label>De</label><input type="date" data-filtro="tInicio" value="${inicio}"></div>

      </div>

    <section class="bloco"><h2>Dias da escala</h2><div class="miolo" style="padding:0">
      ${dias.length ? `<div class="rolavel"><table>
        <thead><tr><th>Data</th><th>Escala</th><th>Serviços</th><th>Situação do dia</th><th></th></tr></thead>
        <tbody>${dias.map((d) => {

          return `<tr>
            <td><strong class="num">${dataBr(d.data)}</strong><div class="sub">${diaSemana(d.data)}</div></td>
            <td>${pilula(idx.escala.get(d.id_escala).situacao)}</td>
            <td class="num">${doDia.length}${doDia.filter((s) => !s.id_militar).length ? `<span class="sub"> (${doDia.filter((s) => !s.id_militar).length} pendente)</span>` : ''}</td>
            <td>${d.trancado ? pilula('NEGADA', 'trancado') + `<div class="sub">${esc(d.motivo_trancamento)}</div>` : pilula('AUTORIZADA', 'aberto')}</td>

              : `<button class="acao mini" data-trancar="${d.id_dia_escala}" ${d.data < HOJE ? 'disabled' : ''}>Trancar</button>`}</td></tr>`;

  const inicio = f('hInicio', somarDias(HOJE, -180)), fim = f('hFim', somarDias(HOJE, 60));
  const m = militar(idMilitar);
  const lista = servicos({ inicio, fim, idMilitar, incluirRascunho: true }).slice().reverse();
  const totais = new Map();
  for (const s of lista) totais.set(s.nome_tipo_servico, (totais.get(s.nome_tipo_servico) || 0) + 1);
  const impedimentos = bd.missoes.filter((x) => x.id_militar === idMilitar);

  return `

function janelaCronologia(id) {
  const s = solicitacaoDetalhada(bd.solicitacoes.find((x) => x.id_solicitacao === id));

  return () => `<div class="fundo" data-fundo="1"><div class="janela"><header>

        <li><strong>Solicitação registrada</strong>
          <div class="quando">${esc(s.solicitante_posto + ' ' + s.solicitante_nome_guerra)} · ${dataHoraBr(s.data_solicitacao)}</div>

        ${pareceres.map((p) => { const u = bd.usuarios.find((x) => x.id_usuario === p.id_usuario_avaliador); const m = u ? militar(u.id_militar) : null;

/* ---------- UC11 / UC12 — FEATURE EXCLUSIVA DO MILSCALE ---------- */
const CONFIG_ETAPA = {
  TRIAGEM: { fila: 'Solicitações aguardando triagem de viabilidade', aprovar: 'Parecer favorável — encaminhar ao sargenteante',
    recusar: 'Parecer desfavorável — indeferir',
    texto: 'Primeira etapa da cadeia (RN08): o cabo da sargenteação verifica se a troca é possível e, sendo viável, encaminha ao sargenteante. O parecer é gravado com etapa TRIAGEM.' },
  AUTORIZACAO: { fila: 'Solicitações aguardando autorização final', aprovar: 'Autorizar — aplica a troca na escala',
    recusar: 'Negar solicitação',
    texto: 'Etapa final da cadeia (RN08/RN09): a autorização do sargenteante altera a escala automaticamente e recalcula os contadores dos militares envolvidos. O parecer é gravado com etapa AUTORIZACAO.' }
};

function telaAvaliacao(etapaNome) {
  const cfg = CONFIG_ETAPA[etapaNome];
  const etapa = produto.estrategiaAprovacaoTroca.etapas().find((e) => e.etapa === etapaNome);
  if (!etapa) return `<section class="bloco"><div class="silencio">
    O produto configurado (${esc(produto.codigo)}) não possui esta etapa: a estratégia
    ${esc(produto.estrategiaAprovacaoTroca.identificador)} decide em uma única etapa.</div></section>`;
  const fila = solicitacoes({ situacao: etapa.situacaoAguardando });
  const total = produto.estrategiaAprovacaoTroca.etapas().length;
  // Com etapa única a decisão não encerra uma cadeia: o texto acompanha a estratégia injetada.
  const texto = total === 1
    ? 'Etapa única (RF12): o coordenador decide direto e a aprovação altera a escala automaticamente, recalculando os contadores dos envolvidos. Não há triagem prévia neste produto.'
    : cfg.texto;
  return `
    <div class="variacao"><b>Ponto de variação: ${esc(produto.estrategiaAprovacaoTroca.identificador)}</b>
      <div style="margin-top:4px">${esc(texto)}</div>
      <div class="etapas">Etapa ${etapa.ordem} de ${total} — ${esc(etapa.rotulo)}. Perfil responsável: ${esc(etapa.perfilResponsavel.replace(/_/g, ' '))}.</div></div>
    <section class="bloco"><h2>${esc(cfg.fila)}</h2><div class="miolo" style="padding:0">
      ${fila.length ? `<div class="rolavel"><table>
        <thead><tr><th>Data do serviço</th><th>Serviço</th><th>Solicitante</th><th>Substituto indicado</th><th>Registrada em</th><th></th></tr></thead>
        <tbody>${fila.map((s) => `<tr>
          <td><strong class="num">${dataBr(s.data_servico)}</strong>${s.trancado ? '<div>' + pilula('NEGADA', 'dia trancado') + '</div>' : ''}</td>
          <td>${esc(s.nome_tipo_servico)}</td><td>${esc(s.solicitante_posto + ' ' + s.solicitante_nome_guerra)}</td>
          <td>${s.substituto_nome_guerra ? esc(s.substituto_posto + ' ' + s.substituto_nome_guerra) : 'Troca aberta'}</td>
          <td class="sub num">${dataHoraBr(s.data_solicitacao)}</td>
          <td><button class="acao mini forte" data-parecer="${s.id_solicitacao}">Analisar</button></td></tr>`).join('')}
        </tbody></table></div>` : '<div class="silencio">Não há solicitações nesta etapa.</div>'}
    </div></section>`;
}
TELAS.triagem = () => telaAvaliacao('TRIAGEM');
TELAS.autorizacao = () => telaAvaliacao('AUTORIZACAO');

function janelaParecer(id) {
  const s = solicitacaoDetalhada(bd.solicitacoes.find((x) => x.id_solicitacao === id));
  const etapa = produto.estrategiaAprovacaoTroca.etapaCorrente(s.situacao);
  const pareceres = bd.pareceres.filter((p) => p.id_solicitacao === id);
  const serv = servicoDetalhado(idx.servico.get(s.id_servico_escalado));
  const sugeridos = substitutosPossiveis(s.id_servico_escalado).slice(0, 12);
  let validacao;
  if (!s.id_militar_substituto) validacao = { apto: false, motivo: 'Troca aberta: nenhum substituto indicado pelo solicitante.' };
  else validacao = validador.avaliar(militar(s.id_militar_substituto), tipoServico(serv.id_tipo_servico), serv.data,
    { ignorarServico: serv.id_servico_escalado, considerarTrancamento: true });
  const d = etapa ? etapa.decisoesPossiveis : [];

  return () => `<div class="fundo" data-fundo="1"><div class="janela"><header>
      <h3>Solicitação nº ${id}</h3><button class="acao mini" data-fechar="1">Fechar</button></header>
    <form class="miolo" data-form="parecer" data-sol="${id}">

        <tr><td>Solicitante</td><td>${esc(s.solicitante_posto + ' ' + s.solicitante_nome_guerra)}</td></tr>
        <tr><td>Substituto indicado</td><td>${s.substituto_nome_guerra ? esc(s.substituto_posto + ' ' + s.substituto_nome_guerra) : 'Troca aberta — nenhum substituto indicado'}</td></tr>
        <tr><td>Motivo</td><td>${esc(s.motivo)}</td></tr>
        <tr><td>Situação atual</td><td>${pilula(s.situacao)}</td></tr>
      </tbody></table>
      <div class="nota ${validacao.apto ? 'ok' : 'info'}"><strong>Validação automática de elegibilidade (UC15):</strong>
        ${validacao.apto ? 'substituto apto para assumir este serviço nesta data.' : esc(validacao.motivo)}</div>
      <div class="campo"><label>Substituto sugerido pelo sistema (opcional)</label>
        <select name="sugerido"><option value="">Manter a indicação atual</option>
          ${sugeridos.map((c) => `<option value="${c.militar.id_militar}">${esc(nome(c.militar))} — ${c.diasSemServico} dias sem serviço</option>`).join('')}</select></div>
      ${pareceres.length ? `<h4 style="margin:16px 0 8px">Pareceres já registrados</h4><ul class="cronologia">
        ${pareceres.map((p) => `<li><strong>${esc(p.etapa)} — ${esc(p.resultado)}</strong>
          <div class="quando">${dataHoraBr(p.data_parecer)}</div><div>${esc(p.justificativa)}</div></li>`).join('')}</ul>` : ''}
      <div class="campo"><label>Justificativa do parecer (obrigatória)</label><textarea name="justificativa"></textarea></div>
      <footer style="padding:0;border:0;margin-top:6px;flex-wrap:wrap">
        <button type="button" class="acao" data-fechar="1">Fechar</button>
        ${d.includes('DEVOLVER') ? '<button type="submit" class="acao" name="decisao" value="DEVOLVER">Devolver ao cabo</button>' : ''}
        ${d.includes('RECUSAR') ? `<button type="submit" class="acao risco" name="decisao" value="RECUSAR">${esc(CONFIG_ETAPA[etapa.etapa].recusar)}</button>` : ''}
        ${d.includes('APROVAR') ? `<button type="submit" class="acao forte" name="decisao" value="APROVAR">${esc(CONFIG_ETAPA[etapa.etapa].aprovar)}</button>` : ''}
      </footer>
    </form></div></div>`;
}

/* =======================================================================
   Eventos — delegação única na raiz
   ======================================================================= */

function fecharJanela() { janela = null; desenhar(); }

app.addEventListener('click', (ev) => {
  const alvo = ev.target.closest('[data-ir],[data-sair],[data-tema],[data-trocar-produto],[data-chave],[data-fechar],[data-fundo],[data-troca],[data-alterar],[data-gerar],[data-publicar],[data-descartar],[data-trancar],[data-destrancar],[data-cronologia],[data-parecer],[data-cancelar-sol],[data-novo-militar],[data-editar-militar],[data-situacao-militar],[data-nova-missao],[data-encerrar-missao],[data-rotina],[data-lida],[data-imprimir],[data-novo-curso]');
  if (!alvo) return;
  const d = alvo.dataset;

  if (d.fundo !== undefined && ev.target !== alvo) return;      // clique dentro da janela não fecha
  if (d.fundo !== undefined || d.fechar) return fecharJanela();

  if (d.ir) return ir(d.ir);
  if (d.sair) { sessao = null; rota = 'painel'; ultimoRelatorio = null; return desenhar(); }
  if (d.chave) { filtros.login = d.chave; filtros.senha = 'milscale'; return desenhar(); }
  if (d.imprimir) return window.print();

  if (d.tema) {
    const atual = document.documentElement.dataset.theme
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = atual === 'dark' ? 'light' : 'dark';
    return;
  }

  /* Troca do produto da LPS: o núcleo continua o mesmo, mudam só os plugins injetados. */
  if (d.trocarProduto) {
    produto = produto.codigo === 'MILSCALE' ? catalogoDeProdutos.SMARTSCALE : catalogoDeProdutos.MILSCALE;
    const etapas = produto.estrategiaAprovacaoTroca.etapas();
    if (['triagem', 'autorizacao'].includes(rota) && !etapas.some((e) => e.etapa === (rota === 'triagem' ? 'TRIAGEM' : 'AUTORIZACAO'))) rota = 'solicitacoes';
    avisar('info', `Produto configurado: ${produto.nome}. Elegibilidade → ${produto.regraElegibilidade.identificador}; `
      + `aprovação de troca → ${produto.estrategiaAprovacaoTroca.identificador} (${etapas.length} etapa(s)). `
      + 'Nenhuma linha do núcleo mudou: só o registro de plugins.');
    return desenhar();
  }

  if (d.troca) { janela = janelaSolicitarTroca(Number(d.troca)); return desenhar(); }
  if (d.alterar) { janela = janelaAlterarServico(Number(d.alterar)); return desenhar(); }
  if (d.cronologia) { janela = janelaCronologia(Number(d.cronologia)); return desenhar(); }
  if (d.parecer) { janela = janelaParecer(Number(d.parecer)); return desenhar(); }
  if (d.novoMilitar) { janela = janelaMilitar(null); return desenhar(); }
  if (d.editarMilitar) { janela = janelaMilitar(Number(d.editarMilitar)); return desenhar(); }
  if (d.novaMissao) { janela = janelaMissao(); return desenhar(); }
  if (d.trancar) { janela = janelaTrancar(Number(d.trancar), true); return desenhar(); }
  if (d.novoCurso) { avisar('info', 'O cadastro de cursos é somente leitura neste protótipo; na versão executável ele tem inclusão, alteração e exclusão completas.'); return desenhar(); }

  if (d.gerar) {
    return operar(() => {
      const forcar = d.gerar === 'forcar';
      try {
        ultimoRelatorio = gerarEscala({ dataInicio: filtros.gInicio || primeiroDoMes(), dataFim: filtros.gFim || ultimoDoMes(),
          descricao: filtros.gDescricao, idTipoServico: Number(filtros.gTipo) || null,
          confirmarCiclo: forcar, substituirRascunho: forcar });
        filtros.gConfirmar = false;
      } catch (e) {
        if (!forcar && (e.message.includes('ciclo mínimo') || e.message.includes('rascunho'))) filtros.gConfirmar = true;
        throw e;
      }
      return ultimoRelatorio;
    }, (r) => `Escala gerada em ${r.duracaoMs} ms: ${r.totalServicosGerados} serviço(s) escalado(s) e ${r.totalPendencias} pendência(s). Confira e publique.`);
  }
  if (d.publicar) return operar(() => publicarEscala(Number(d.publicar)), (n) => `Escala publicada. ${n} militar(es) notificado(s).`);
  if (d.descartar) return operar(() => { descartarRascunho(Number(d.descartar)); ultimoRelatorio = null; }, 'Rascunho descartado.');
  if (d.destrancar) return operar(() => destrancarDia(Number(d.destrancar), 'Liberado pela sargenteação.'), 'Dia destrancado; as trocas voltam a ser aceitas.');
  if (d.cancelarSol) return operar(() => cancelarSolicitacao(Number(d.cancelarSol)), 'Solicitação cancelada.');
  if (d.situacaoMilitar) {
    return operar(() => {
      const m = idx.militar.get(Number(d.situacaoMilitar));
      if (m.situacao === 'ATIVO') {
        const futuro = bd.servicos.some((s) => s.id_militar === m.id_militar && s.situacao === 'PREVISTO' && idx.dia.get(s.id_dia_escala).data >= HOJE);
        if (futuro) throw new ErroDeNegocio('Militar possui serviço previsto na escala. Substitua-o antes de inativar.');
        m.situacao = 'AFASTADO';
      } else m.situacao = 'ATIVO';
      auditar('MILITAR', m.id_militar, 'ALTERACAO', null, { situacao: m.situacao });
      return m;
    }, (m) => `${m.nome_guerra} agora está ${m.situacao.toLowerCase()}.`);
  }
  if (d.encerrarMissao) {
    return operar(() => {
      const ms = bd.missoes.find((x) => x.id_missao === Number(d.encerrarMissao));
      ms.data_fim = HOJE < ms.data_inicio ? ms.data_inicio : HOJE;
      idx.militar.get(ms.id_militar).data_fim_ultima_missao = ms.data_fim;
      auditar('MISSAO', ms.id_missao, 'ALTERACAO', null, { data_fim: ms.data_fim, liberadoAPartirDe: somarDias(ms.data_fim, 1) });
      return ms;
    }, 'Impedimento encerrado; o militar retorna à fila sem prioridade na escalação (RN16).');
  }
  if (d.rotina) return operar(() => { filtros.nResumo = rotinaD1(filtros.nData || HOJE); }, 'Rotina D-1 executada.');
  if (d.lida) {
    return operar(() => {
      const n = bd.notificacoes.find((x) => x.id_notificacao === Number(d.lida));
      if (n && n.id_militar === sessao.id_militar) n.situacao_envio = 'LIDA';
    });
  }
});

/* filtros */
app.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.filtro) { filtros[el.dataset.filtro] = el.value; filtros.gConfirmar = false; return desenhar(); }
  if (el.dataset.filtroBool) { filtros[el.dataset.filtroBool] = el.checked; return desenhar(); }
});
app.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.dataset.filtro === 'miBusca') {
    filtros.miBusca = el.value;
    clearTimeout(app._t);
    app._t = setTimeout(() => { desenhar(); const b = document.querySelector('[data-filtro="miBusca"]'); if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }, 260);
  }
});

/* formulários */
app.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const form = ev.target;
  const v = (n) => (form.elements[n] ? String(form.elements[n].value).trim() : '');

  if (form.dataset.portaria) {
    const login = v('login');
    if (v('senha') !== 'milscale') { avisar('erro', 'CPF ou senha inválidos.'); return desenhar(); }
    return operar(() => { entrar(login); rota = 'painel'; filtros.senha = ''; });
  }
  if (form.dataset.form === 'solicitar') {
    return operar(() => registrarSolicitacao(Number(form.dataset.servico), Number(v('substituto')) || null, v('motivo')),
      'Solicitação registrada. O cabo da sargenteação foi notificado.');
  }
  if (form.dataset.form === 'alterar') {
    return operar(() => alterarServico(Number(form.dataset.servico), Number(v('substituto')) || null, v('justificativa')),
      'Escala alterada, contadores recalculados e envolvidos notificados.');
  }
  if (form.dataset.form === 'parecer') {
    const decisao = (ev.submitter && ev.submitter.value) || 'APROVAR';
    return operar(() => avaliarSolicitacao(Number(form.dataset.sol), decisao, v('justificativa'), Number(v('sugerido')) || null),
      decisao === 'APROVAR' ? 'Parecer registrado; a solicitação avançou na cadeia de aprovação.'
        : decisao === 'DEVOLVER' ? 'Solicitação devolvida ao cabo para reanálise.' : 'Solicitação indeferida e solicitante notificado.');
  }
  if (form.dataset.form === 'trancar') {
    const indeferir = form.elements.indeferir ? form.elements.indeferir.checked : false;
    return operar(() => trancarDia(Number(form.dataset.dia), v('motivo'), indeferir),
      (n) => `Dia trancado.${n ? ` ${n} solicitação(ões) pendente(s) foram indeferidas.` : ''}`);
  }
  if (form.dataset.form === 'missao') {
    return operar(() => {
      const idMilitar = Number(v('militar')), inicio = v('inicio'), fim = v('fim');
      if (!v('descricao')) throw new ErroDeNegocio('Informe a descrição do impedimento.');
      if (fim < inicio) throw new ErroDeNegocio('A data final não pode anteceder a inicial.');
      if (bd.missoes.some((m) => m.id_militar === idMilitar && m.data_inicio <= fim && m.data_fim >= inicio))
        throw new ErroDeNegocio('O período se sobrepõe a outro impedimento do mesmo militar.');
      const id = proximoId('missoes', 'id_missao');
      bd.missoes.push({ id_missao: id, id_militar: idMilitar, tipo: v('tipo'), descricao: v('descricao'),
        data_inicio: inicio, data_fim: fim, id_usuario_registro: sessao.id_usuario, data_registro: agora() });
      const m = idx.militar.get(idMilitar);
      if (!m.data_fim_ultima_missao || fim > m.data_fim_ultima_missao) m.data_fim_ultima_missao = fim;
      // UC16-E1: serviços já escalados no período ficam pendentes de substituição.
      let afetados = 0;
      for (const s of bd.servicos) {
        if (s.id_militar !== idMilitar || s.situacao !== 'PREVISTO') continue;
        const data = idx.dia.get(s.id_dia_escala).data;
        if (data < inicio || data > fim) continue;
        s.id_militar = null;
        s.observacao = `Pendente: militar em ${v('tipo').toLowerCase()} (${v('descricao')}).`;
        afetados += 1;
      }
      auditar('MISSAO', id, 'INCLUSAO', null, { militar: idMilitar, periodo: `${inicio} a ${fim}`, servicosAfetados: afetados });
      return afetados;
    }, (n) => n ? `Impedimento registrado. ${n} serviço(s) já escalado(s) no período foram marcados como pendentes.`
                : 'Impedimento registrado; as datas ficam bloqueadas para escalação.');
  }
  if (form.dataset.form === 'militar') {
    return operar(() => {
      const id = Number(form.dataset.id);
      const cpf = v('cpf').replace(/\D/g, '');
      if (v('nome_completo').length < 3 || v('nome_guerra').length < 2) throw new ErroDeNegocio('Nome completo e nome de guerra são obrigatórios.');
      if (cpf.length !== 11) throw new ErroDeNegocio('CPF inválido: informe 11 dígitos.');
      const homonimo = bd.militares.find((m) => m.cpf === cpf && m.id_militar !== id);
      if (homonimo) throw new ErroDeNegocio('CPF já utilizado por outro militar.');
      const marcados = [...form.querySelectorAll('input[name="curso"]:checked')].map((c) => Number(c.value));
      const dados = { nome_completo: v('nome_completo'), nome_guerra: v('nome_guerra'), cpf, id_posto: Number(v('id_posto')),
        email: v('email') || null, telefone: v('telefone') || null, situacao: v('situacao') };

      let alvo;
      if (id) { alvo = idx.militar.get(id); Object.assign(alvo, dados); auditar('MILITAR', id, 'ALTERACAO', null, dados); }
      else {
        const novo = proximoId('militares', 'id_militar');
        alvo = { id_militar: novo, ...dados, dias_sem_servico: 0, data_fim_ultima_missao: null };
        bd.militares.push(alvo);
        bd.usuarios.push({ id_usuario: proximoId('usuarios', 'id_usuario'), id_militar: novo, id_perfil: 1, login: cpf });
        auditar('MILITAR', novo, 'INCLUSAO', null, dados);
      }
      bd.militar_curso = bd.militar_curso.filter((x) => x.id_militar !== alvo.id_militar)
        .concat(marcados.map((c) => ({ id_militar: alvo.id_militar, id_curso: c, data_conclusao: HOJE })));
      return alvo;
    }, (m) => `Cadastro de ${m.nome_guerra} gravado.`);
  }
});

document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && janela) fecharJanela(); });

desenhar();
</script>
